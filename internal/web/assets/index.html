<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sentra</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <!-- outrun wallpaper: perspective grid + neon sun, behind everything -->
  <div class="backdrop" aria-hidden="true">
    <div class="sun"></div>
    <div class="grid"></div>
    <div class="scanlines"></div>
  </div>

  <!-- unlock gate -->
  <div id="unlock" class="overlay" hidden>
    <form id="unlock-form" class="card unlock-card">
      <div class="logo big">✦ S E N T R A ✦</div>
      <label class="ul-label" for="pass">repository passphrase</label>
      <input id="pass" type="password" autocomplete="off" autofocus
             placeholder="repository passphrase">
      <button type="submit" class="btn primary">Unlock</button>
      <div id="unlock-err" class="err" hidden></div>
    </form>
  </div>

  <!-- app shell -->
  <div id="app" class="app" hidden>
    <aside class="rail">
      <div class="rail-logo">✦ sentra</div>
      <nav id="nav"></nav>
    </aside>
    <main class="main">
      <header class="topbar"><span class="logo">✦ S E N T R A ✦</span></header>
      <section id="content" class="content"></section>
      <footer class="statusbar">
        <span id="repo" class="repo"></span>
        <span class="hints">esc back · enter confirm</span>
      </footer>
    </main>
  </div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
