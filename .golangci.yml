version: "2"
run:
  tests: true
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - bin
      - dist
      - third_party/
      - builtin$
      - examples$
    rules:
      # SA5011 false positive: `if x == nil { t.Fatal(...) }` followed by a
      # deref is safe because t.Fatal calls runtime.Goexit, but the staticcheck
      # bundled in newer golangci-lint no longer models that as terminating.
      # Keep SA5011 active in production code; silence it only in tests.
      - path: _test\.go
        linters:
          - staticcheck
        text: SA5011
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - bin
      - dist
      - third_party/
      - builtin$
      - examples$
