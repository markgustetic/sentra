name: release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). The git tag drives
# goreleaser's version templating.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release + upload artifacts
  packages: write   # push the container image to GHCR
  id-token: write   # cosign keyless signing via OIDC

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full history to compute the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU
        # Needed by goreleaser dockers_v2 to build the arm64 image on
        # the amd64 runner.
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1
        with:
          # Pin the cosign BINARY to the v2 line: v3 changed sign-blob to
          # bundle-format output and rejects the v2-style flag pair the
          # goreleaser signs block (and the README verification snippet)
          # are written for. v2 is actively maintained alongside v3; use a
          # recent v2 so the installer can verify its download.
          cosign-release: 'v2.6.5'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `contents: write` on markgustetic/homebrew-tap so
          # the tap repo can be updated. Documented in the README.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
