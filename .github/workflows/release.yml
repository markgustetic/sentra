name: release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). The git tag drives
# goreleaser's version templating.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release + upload artifacts
  id-token: write   # cosign keyless signing via OIDC

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the full history to compute the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1
        with:
          # Pin the cosign BINARY to the v2 line: v3 changed sign-blob to
          # bundle-format output and rejects the v2-style flag pair the
          # goreleaser signs block (and the README verification snippet)
          # are written for. v2 is actively maintained alongside v3; use a
          # recent v2 so the installer can verify its download.
          cosign-release: 'v2.6.5'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `contents: write` on markgustetic/homebrew-tap so
          # the tap repo can be updated. Documented in the README.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
