name: ci

# Default to read-only at the workflow level. Individual jobs add the
# specific scopes they need (e.g. statuses:write for codecov status
# checks). This blocks future steps from silently inheriting broader
# permissions if `permissions:` is omitted on a job.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
      - run: go mod tidy -diff
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Test vendored FastCDC
        run: go test ./...
        working-directory: third_party/fastcdc-go
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          files: coverage.out
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
      - run: go test -tags=integration -race -count=1 ./internal/blobstore
  # Every commit must compile on its own, not just the tip. A gate builds the
  # working TREE, and the two diverge exactly when the tree is dirty — which is
  # when a `git add <file>` can stage a hunk nobody reviewed. Three non-building
  # commits once reached main while every other check passed. `git bisect` is
  # what this protects.
  commits:
    name: every commit builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
      - name: Build each commit standalone
        env:
          # PRs: every commit the PR adds. Pushes: everything since the old tip.
          #
          # Both are SHAs, never branch names: a ref built by interpolating an
          # attacker-influenced value (github.base_ref, github.head_ref) into a
          # command is the classic Actions injection. They reach the script only
          # through env and are always quoted; the commit subject below is only
          # ever a printf '%s' argument, never a shell word.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify -q "${BASE}" >/dev/null; then
            echo "no usable base ref (${BASE:-unset}); building HEAD only"
            go build ./...
            exit 0
          fi
          rc=0
          for sha in $(git rev-list --reverse "${BASE}..${GITHUB_SHA}"); do
            subject="$(git log -1 --format=%s "$sha")"
            git worktree add -q --detach /tmp/wt "$sha"
            if (cd /tmp/wt && go build ./... >/dev/null 2>&1); then
              printf 'ok     %s  %s\n' "$(git rev-parse --short "$sha")" "$subject"
            else
              printf 'BROKEN %s  %s\n' "$(git rev-parse --short "$sha")" "$subject"
              rc=1
            fi
            git worktree remove --force /tmp/wt
          done
          exit $rc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than `latest` so a new golangci-lint release can't
          # break CI with no code change (e.g. a staticcheck check tightening).
          # Bump deliberately.
          version: v2.12.2
